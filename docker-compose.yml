version: "3.8"

services:
  senia:
    build: .
    volumes:
      - senia-data:/app/data
      - senia-runs:/app/service_runs
      - senia-logs:/app/logs
      - ./web_assets:/app/web_assets:ro
    environment:
      - ELITE_API_HOST=0.0.0.0
      - ELITE_API_PORT=8877
      - ELITE_LOG_LEVEL=info
      - ELITE_ENABLE_AUDIT_LOG=true
      - ELITE_ENABLE_SECURITY_HEADERS=true
      - ELITE_ENABLE_API_KEY_AUTH=true
      - ELITE_CORS_ORIGINS=
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8877/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  # Nginx反向代理 — HTTPS + Gzip + 安全头
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web_assets:/app/web_assets:ro
      - ./certs:/etc/nginx/certs:ro  # SSL证书目录
    depends_on:
      senia:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

volumes:
  senia-data:
  senia-runs:
  senia-logs:
